name: Actualizar perfil

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - .github/profile-widgets.mjs

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Actualizar paneles con datos publicos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/profile-widgets.mjs
      - name: Guardar cambios
        shell: bash
        run: |
          git add assets/github-summary-v2.svg assets/github-calendar-v2.svg assets/github-calendar-half-v2.svg assets/profile-technologies-v2.svg assets/steam-recent-v2.svg assets/apple-music-v2.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar actividad publica del perfil"
          git push
